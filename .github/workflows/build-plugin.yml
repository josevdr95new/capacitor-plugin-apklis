name: Build Plugin

on:
  workflow_dispatch:

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and Build Plugin
        run: |
          npm install
          npm run build

      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: plugin-dist
          path: dist/
